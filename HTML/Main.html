<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Generador Horarios</title>
    <link rel="stylesheet" type="text/css" href="../Estilos/Main.css">
</head>
<body>
    <main class="grid-container">

        <h2>CONFIGURACIÓN</h2>
    </aside>

    <section class="secciones-view">
        <h2>GENERADOR DE HORARIO</h2>

        <div class="timetable">

            <div class="header-cell">MARTES</div>
            <div class="header-cell">MIÉRCOLES</div>

            <div class="header-cell">VIERNES</div>

            <div class="header-cell">DOMINGO</div>
            <div class="header-cell">NOTAS</div>
        </div>
    </section>
    </main>

</html>
